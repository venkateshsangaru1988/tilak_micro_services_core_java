server:
  port: 8888

spring:
  application:
    name: ecommerce-config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/venkateshsangaru1988/ecommerce-config-repo.git
          default-label: main
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info