server:
  port: 1001

spring:
  application:
    name: multiple-dbs-connection

  datasource:
    mysql:
      url: jdbc:mysql://localhost:3306/ecommerce_db
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

    h2:
      url: jdbc:h2:mem:productdb
      username: sa
      password:
      driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console