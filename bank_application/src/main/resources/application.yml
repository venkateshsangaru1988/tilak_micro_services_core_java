server:
  port: 8282
  servlet:
    context-path: /bank

spring:
  profiles:
    active: local
  application:
    name: bank_application
  batch:
    job:
      enabled: false

jwt:
  secret: "0123456789012345678901234567890123456789012345678901234567890123"
  expiration: 3600000

scheduler:
  cron: "0 * * * * *"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true