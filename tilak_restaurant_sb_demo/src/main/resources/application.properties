server.port=8181
server.servlet.context-path=/restaurant
spring.application.name=tilak_restaurant_sb_demo


#spring.main.banner-mode=off

# Disable dev tools
spring.devtools.restart.enabled=false

# Profiles active based on environment
spring.profiles.active=local

# Actuators
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

info.app.name=Restaurant Service
info.app.version=1.0.0
info.app.description=Restaurant Management API
info.app.team=Restaurant Team


